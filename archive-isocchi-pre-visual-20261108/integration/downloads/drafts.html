<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNS投稿の下書きボード｜練習用完成見本</title><style>
*{box-sizing:border-box}body{margin:0;background:#071e28;color:#f2f7f5;font-family:Meiryo,"Yu Gothic",sans-serif;line-height:1.8}main{max-width:680px;margin:auto;padding:24px 18px}h1{font-size:24px;color:#f5cf70;margin:0 0 4px}p{margin:8px 0}article{border-top:1px solid #56727a;padding:20px 0}h2{font-size:17px;margin:0;color:#6be0ce}.text{font-size:16px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px 12px;border:1px solid #c5a959;border-radius:5px}button{background:#f5cf70;color:#09252b;cursor:pointer}select{background:#0d3541;color:white}.count{color:#b8d1d2;font-size:14px}small{color:#b8d1d2}#feedback{min-height:1.8em;color:#6be0ce}textarea{width:100%;min-height:80px;font:inherit;padding:8px;background:#0d3541;color:white;border:1px solid #56727a}
</style><main><h1>SNS投稿の下書きボード</h1><small>練習用完成見本・公開前の下書き</small><div id="posts"></div><p id="feedback" role="status"></p><details><summary>コピー全文を貼り付けて確認する</summary><textarea aria-label="コピー確認欄" placeholder="コピーした本文をここへ貼り付ける"></textarea></details><p><small>状態はこのページを開いている間だけ保持します。更新すると全て「下書き」に戻ります。</small></p></main><script>
const posts=["ChatGPTとClaude Code、別々に開いて終わっていませんか？ 設計と確認はClaude Code、作業はCodex。役割を決めると、依頼を受け渡す流れを作れます。まずは小さな1件から試してみて。", "AIに全部まとめて頼む前に、仕事を分けてみる。Claude Codeで完成形を決めて、Codexが作る。保存された実物をClaude Codeが確認して、必要なら直す。この流れをひとつ通してみましょう。", "最初に任せるなら、SNS投稿の下書き3本。読む人、テーマ、文字数、保存先を決めて渡す。返ってきたら文章と文字数を確認する。いきなり大きな仕事より、受け渡しを確かめやすいですよ。"]; document.querySelector('#posts').innerHTML=posts.map((t,i)=>`<article><h2>${i+1}本目</h2><p class="text"></p><p class="count"></p><div class="tools"><button data-i="${i}">本文をコピー</button><select aria-label="${i+1}本目の状態"><option>下書き</option><option>確認中</option><option>使用OK</option></select></div></article>`).join('');
document.querySelectorAll('article').forEach((el,i)=>{el.querySelector('.text').textContent=posts[i];el.querySelector('.count').textContent=Array.from(posts[i]).length+'字／120字以内';});
document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(posts[+b.dataset.i]);document.querySelector('#feedback').textContent=(+b.dataset.i+1)+'本目をコピーしました';}catch(e){const t=document.createElement('textarea');t.value=posts[+b.dataset.i];document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();document.querySelector('#feedback').textContent=ok?'本文をコピーしました':'本文を選択してコピーしてください';}});
</script></html>
