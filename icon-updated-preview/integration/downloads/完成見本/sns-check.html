<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNS投稿前チェック</title><style>
*{box-sizing:border-box}body{margin:0;background:#171a1c;color:#f8f4e9;font:17px/1.7 'Meiryo',sans-serif}main{max-width:660px;margin:auto;padding:38px 20px 42px}small{color:#d8ab63;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(25px,5.8vw,36px);line-height:1.4;margin:10px 0 12px}p{color:#d1d2cf;margin:10px 0 24px}.count{color:#f0bd70;font-size:32px;font-weight:bold;border-bottom:1px solid #5a4934;padding:10px 0 18px;margin:0 0 12px}label{display:flex;gap:14px;align-items:flex-start;padding:16px 4px;border-bottom:1px solid #3c3f3f;cursor:pointer}input{accent-color:#e7a749;width:23px;height:23px;margin:3px 0 0;flex-shrink:0}label:has(input:checked){color:#a5b7a5}button{margin:24px 0 12px;background:#edbb73;color:#201b16;border:0;border-radius:8px;padding:13px 24px;font:inherit;font-weight:bold;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}.note{font-size:13px;color:#b8bbb8;margin:14px 0}footer{font-size:12px;color:#9c9e98;border-top:1px solid #41413a;padding-top:16px;margin-top:28px}</style></head><body><main><small>投稿する前の、最後の確認</small><h1>SNS投稿前チェック</h1><p>原稿と画像を見ながら、一つずつ。</p><div class="count" aria-live="polite"><span id="n">0</span> / 6</div><form id="check">
<label><input type="checkbox"><span>読む人の場面が一つ分かる</span></label><label><input type="checkbox"><span>元の資料にない数字や経験を足していない</span></label><label><input type="checkbox"><span>文章と画像で内容がずれていない</span></label><label><input type="checkbox"><span>リンク先と案内する内容が合っている</span></label><label><input type="checkbox"><span>誤字と改行を見直した</span></label><label><input type="checkbox"><span>公開する内容を自分で確認した</span></label><button type="reset">チェックをリセット</button></form><p class="note">チェック状態は再読込でリセットされます。<br>完了は投稿の許可や成果の保証を意味しません。</p><footer>完成形の見本｜今回、教材用に直接制作したファイルです。AI間の連携実行結果ではありません。</footer></main><script>const f=document.querySelector('form'),n=document.getElementById('n');f.addEventListener('change',()=>n.textContent=f.querySelectorAll(':checked').length);f.addEventListener('reset',()=>n.textContent='0');</script></body></html>
